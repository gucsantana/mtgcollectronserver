spring:
  application:
    name: mtgcollectronserver
  datasource:
    url: jdbc:mysql://localhost:3306/mtg_collectron
    username: admin
    password: ${DB_PASS}
  jpa:
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

scryfall:
  import:
    token: ${SCRYFALL_IMPORT_TOKEN}
    batch-size: ${SCRYFALL_IMPORT_BATCH_SIZE:500}
    user-agent: mtgcollectronserver

server:
  port: 8080
  # address: https://google.com 
  servlet:
    context-path: /mtg-collectron

# mtgcollectronserver:
#   services:
#     url: http://localhost:8080/mtg-collectron/card/

logging:
  file:
    name: logs/application.log
  level:
    root: error
    org:
      springframework:
        web: debug    # necessary to see 400 error descriptions show up on log

