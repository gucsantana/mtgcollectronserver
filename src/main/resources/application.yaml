spring:
  application:
    name: mtgcollectronserver
  datasource:
    url: ${COLLECTRON_DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

scryfall:
  import:
    token: ${SCRYFALL_IMPORT_TOKEN}
    batch-size: ${SCRYFALL_IMPORT_BATCH_SIZE:500}
    user-agent: mtgcollectronserver

server:
  port: 8080
  # address: https://google.com 
  servlet:
    context-path: /mtg-collectron

# mtgcollectronserver:
#   services:
#     url: http://localhost:8080/mtg-collectron/card/

logging:
  level:
    root: INFO
    org.springframework.web: WARN
